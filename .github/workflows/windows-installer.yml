name: Publish signed Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: evolabs-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-windows:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Set up Python 3.11 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Install Rust stable MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install exact frontend dependencies
        shell: pwsh
        run: npm ci

      - name: Validate source and TypeScript
        shell: pwsh
        run: |
          python scripts/validate-source-release.py
          npm run check

      - name: Run frontend tests
        shell: pwsh
        run: npm test

      - name: Build and test bundled Engine
        shell: pwsh
        run: ./scripts/build-engine.ps1

      - name: Refresh Rust lockfile for release dependencies
        shell: pwsh
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml

      - name: Build, sign and publish NSIS update
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: Evolabs Agent Studio v__VERSION__
          releaseBody: |
            Evolabs Agent Studio signed Windows release.
            Install the Setup.exe once; later releases can be installed from inside Evolabs.
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --bundles nsis --target x86_64-pc-windows-msvc --ci

      - name: Keep Windows installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Evolabs-Windows-x64-${{ github.ref_name }}
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: error
          retention-days: 30
