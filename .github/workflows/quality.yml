name: Validate Evolabs source

on:
  push:
    branches:
      - "agent/v0.8.0-real-video-studio"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evolabs-quality-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-windows:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Set up Python 3.11 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Install Rust stable MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Synchronize current version and lockfile
        shell: pwsh
        run: |
          python scripts/sync-release-version.py
          cargo generate-lockfile --manifest-path src-tauri/Cargo.toml

      - name: Install exact frontend dependencies
        shell: pwsh
        run: npm ci

      - name: Validate release source
        shell: pwsh
        run: python scripts/validate-source-release.py

      - name: Type-check frontend
        shell: pwsh
        run: npm run check

      - name: Run frontend tests
        shell: pwsh
        run: npm test

      - name: Build frontend assets for Tauri context
        shell: pwsh
        run: npm run build:web

      - name: Compile and test Tauri commands
        shell: pwsh
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build and test bundled Engine
        shell: pwsh
        run: ./scripts/build-engine.ps1

      - name: Generate final monochrome icons
        shell: pwsh
        run: '& ./.build/engine-venv/Scripts/python.exe scripts/generate_icons.py'
