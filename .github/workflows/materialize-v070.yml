name: Materialize Evolabs v0.7.0 source

on:
  push:
    branches:
      - "release/v0.7.0-ui-reliability"

permissions:
  contents: write

concurrency:
  group: evolabs-v070-materialize
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize verified source payload
        run: python scripts/materialize-v070.py

      - name: Commit complete v0.7.0 source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Build Evolabs v0.7.0 product experience [skip ci]"
          git push origin HEAD:release/v0.7.0-ui-reliability
