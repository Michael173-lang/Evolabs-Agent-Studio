name: Probe Evolabs v0.7.0 publish

on:
  push:
    branches:
      - "ops/publish-probe-v070"

permissions:
  actions: write
  contents: write

concurrency:
  group: evolabs-v070-publish-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out probe branch
        uses: actions/checkout@v4

      - name: Capture compact final release state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          runs_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/windows-installer.yml/runs?branch=publish&per_page=5")"
          success_run_id="$(jq -r '[.workflow_runs[] | select(.conclusion == "success")][0].id // empty' <<<"$runs_json")"
          if [[ -n "$success_run_id" ]]; then
            jobs_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${success_run_id}/jobs?per_page=100")"
            artifacts_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${success_run_id}/artifacts?per_page=100")"
          else
            jobs_json='{"jobs":[]}'
            artifacts_json='{"artifacts":[]}'
          fi
          if release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v0.7.0" 2>/dev/null)"; then
            :
          else
            release_json='null'
          fi
          jq -n \
            --arg captured_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson runs "$runs_json" \
            --argjson jobs "$jobs_json" \
            --argjson artifacts "$artifacts_json" \
            --argjson release "$release_json" \
            '{
              captured_at:$captured_at,
              runs:[$runs.workflow_runs[] | {id,run_number,head_sha,status,conclusion,created_at,updated_at,html_url}],
              job:($jobs.jobs[0] // null | if . == null then null else {id,name,status,conclusion,steps:[.steps[] | {number,name,status,conclusion}]} end),
              artifacts:[$artifacts.artifacts[] | {id,name,size_in_bytes,expired,digest,created_at,expires_at,archive_download_url}],
              release:(if $release == null then null else ($release | {id,tag_name,name,draft,prerelease,published_at,html_url,target_commitish,assets:[.assets[] | {id,name,label,state,content_type,size,digest,download_count,created_at,updated_at,browser_download_url}]}) end)
            }' > release/publish-status-compact-v0.7.0.json

      - name: Commit probe result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f release/publish-status-compact-v0.7.0.json
          git commit -m "Record compact Evolabs v0.7.0 release state [skip ci]" || exit 0
          git push origin HEAD:ops/publish-probe-v070
