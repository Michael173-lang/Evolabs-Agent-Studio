name: Probe Evolabs v0.7.0 publish

on:
  push:
    branches:
      - "ops/publish-probe-v070"

permissions:
  actions: read
  contents: write

concurrency:
  group: evolabs-v070-publish-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out probe branch
        uses: actions/checkout@v4

      - name: Capture latest publish run and release state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          runs_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/windows-installer.yml/runs?branch=publish&per_page=1")"
          run_id="$(jq -r '.workflow_runs[0].id // empty' <<<"$runs_json")"
          if [[ -n "$run_id" ]]; then
            jobs_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100")"
            artifacts_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100")"
          else
            jobs_json='{"jobs":[]}'
            artifacts_json='{"artifacts":[]}'
          fi
          if release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v0.7.0" 2>/dev/null)"; then
            :
          else
            release_json='null'
          fi
          jq -n \
            --arg captured_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson runs "$runs_json" \
            --argjson jobs "$jobs_json" \
            --argjson artifacts "$artifacts_json" \
            --argjson release "$release_json" \
            '{captured_at:$captured_at, run:($runs.workflow_runs[0] // null), jobs:$jobs.jobs, artifacts:$artifacts.artifacts, release:$release}' \
            > release/publish-status-v0.7.0.json

      - name: Commit probe result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f release/publish-status-v0.7.0.json
          git commit -m "Record Evolabs v0.7.0 publish status [skip ci]" || exit 0
          git push origin HEAD:ops/publish-probe-v070
